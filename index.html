<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的课表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#34363a; --ink2:#777875; --ink3:#aca9a2;
  --line:#edf0f1; --brand:#9bbbc4; --brand2:#cbdde0;
  --rose:#e99c9c;--blue:#8db9dc;--purple:#8ea7df;--orange:#e9a46c;--teal:#75c3a0;--green:#e8c25d;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{display:flex;align-items:center;justify-content:center}
.phone{
  width:393px;height:852px;background:#ffffff;border-radius:42px;overflow:hidden;
  box-shadow:0 24px 60px rgba(74,61,47,.16),0 0 0 8px #2a2926;
  display:flex;flex-direction:column;position:relative;flex:0 0 auto;
}
/* ---------- status bar ---------- */
.sbar{height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;background:#f7fbff;position:relative;z-index:3}
.sbar .dots{display:flex;gap:5px;align-items:center}
.sbar .dots i{width:4px;height:9px;background:var(--ink);border-radius:1px;display:block;opacity:.85}
.sbar .dots i:nth-child(1){height:5px}.sbar .dots i:nth-child(2){height:7px}
.sbar .bat{width:23px;height:11px;border:1.4px solid var(--ink);border-radius:3px;position:relative;opacity:.8}
.sbar .bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 2px 2px 0}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#16181d;
  border-radius:0 0 18px 18px;z-index:5}

/* ---------- app bar ---------- */
.appbar{display:none}
.appbar:after{display:none}
.appbar:before{display:none}
.ab-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.ab-title{font-size:24px;font-weight:800;letter-spacing:-.5px}
.ab-title span{font-size:12px;font-weight:500;opacity:.85;margin-left:6px}
.today-btn{font-size:13px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);padding:8px 14px;border-radius:22px;color:#4d7f89;cursor:pointer;font-weight:700}
.ab-sub{font-size:14px;opacity:.82;margin-top:7px;position:relative;z-index:2;line-height:1.5}

/* ---------- week bar ---------- */
.weekbar{flex:0 0 auto;background:#f7fbff;padding:12px 14px;display:flex;align-items:center;gap:8px;
  box-shadow:0 1px 0 var(--line),0 4px 14px rgba(20,30,60,.05);position:relative;z-index:2}
.nav{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#f0ebfa;display:flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);font-size:15px;font-weight:700;
  border:none;transition:.15s}
.nav:hover{background:#e6ecf8;color:var(--brand)}
.nav:disabled{opacity:.3;cursor:not-allowed}
.wk-mid{flex:1;text-align:center;cursor:pointer;padding:2px 0}
.wk-mid h3{font-size:17px;font-weight:700;letter-spacing:.2px}
.wk-mid h3 em{font-style:normal;font-size:11px;color:var(--brand);background:#eaf0fe;
  padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:2px;font-weight:600}
.wk-mid p{font-size:11.5px;color:var(--ink2);margin-top:3px}
.wk-mid p b{color:var(--ink);font-weight:600}

/* ---------- day strip ---------- */
.daystrip{flex:0 0 auto;background:#f7fbff;padding:8px 8px 10px;display:flex;gap:4px}
.dchip{flex:1;text-align:center;padding:6px 0;border-radius:12px;cursor:pointer;transition:.16s;position:relative}
.dchip .dw{font-size:11px;color:var(--ink3);font-weight:600}
.dchip .dd{font-size:16px;font-weight:700;margin-top:2px;color:var(--ink);line-height:1.1}
.dchip .dot{width:4px;height:4px;border-radius:50%;background:var(--brand);margin:3px auto 0}
.dchip .dot.hide{background:transparent}
.dchip.on{background:#b9edff;box-shadow:0 5px 12px rgba(99,191,224,.22)}
.dchip.on .dw,.dchip.on .dd{color:#28738b}
.dchip.on .dot{background:#57b8d7}
.dchip.today:not(.on){background:#efe6ff}
.dchip.today:not(.on) .dw{color:#8468ae}
.dchip.today:not(.on) .dd{color:#695387}
.dchip.wide{flex:1.25;background:#f0f6f7}
.dchip.wide.on{background:var(--brand)}
.dchip.wide .dw{font-size:10.5px}
.dchip.wide .dd{font-size:12.5px;margin-top:5px}

/* ---------- switch ---------- */
.switch{flex:0 0 auto;padding:0 14px 10px;background:#f7fbff}
.seg{display:flex;background:#f1f3f7;border-radius:11px;padding:3px}
.seg button{flex:1;border:none;background:transparent;padding:7px 0;font-size:13px;font-weight:600;
  color:var(--ink2);border-radius:9px;cursor:pointer;transition:.16s}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(20,30,60,.10)}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 18px;background:#f7fafc}
.content:has(.gridwrap){display:flex;flex-direction:column;padding-bottom:0}
.content::-webkit-scrollbar{width:0}

.dayhead{display:flex;align-items:baseline;gap:8px;margin:4px 2px 10px}
.dayhead h4{font-size:14px;font-weight:700}
.dayhead span{font-size:11.5px;color:var(--ink3)}
.dayhead .tag{font-size:10.5px;color:var(--brand);background:#eaf0fe;padding:2px 7px;border-radius:7px;font-weight:600}

.card{background:var(--card);border:1px solid #e0e9ed;border-radius:18px;padding:14px;margin-bottom:10px;display:flex;gap:12px;
  box-shadow:0 6px 18px rgba(69,96,107,.08);cursor:pointer;position:relative;overflow:hidden;transition:.16s}
.card:active{transform:scale(.985)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .tcol{flex:0 0 52px;border-right:1px solid var(--line);padding-right:10px}
.card .tcol .t1{font-size:14px;font-weight:700;letter-spacing:-.2px}
.card .tcol .t2{font-size:10px;color:var(--ink3);margin-top:3px;line-height:1.35}
.card .body{flex:1;min-width:0}
.card .body h5{font-size:15px;font-weight:700;line-height:1.3}
.card .body .meta{font-size:12px;color:var(--ink2);margin-top:7px;display:flex;flex-direction:column;gap:4px}
.card .body .meta div{display:flex;align-items:flex-start;gap:6px}
.card .body .meta b{font-weight:500;color:var(--ink3);flex:0 0 auto;font-size:11.5px}
.card .wk{position:absolute;right:12px;top:12px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px}

.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty .ic{font-size:40px;opacity:.5}
.empty p{font-size:13px;margin-top:10px}

/* ---------- grid ---------- */
.gridwrap{background:var(--card);border:1px solid #e0e9ed;border-radius:18px;padding:10px 8px 12px;box-shadow:0 6px 18px rgba(69,96,107,.08);min-height:100%;flex:1;display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:34px repeat(7,1fr);grid-template-rows:auto repeat(5,minmax(0,1fr));gap:3px;align-items:stretch;flex:1}
.gh{text-align:center;font-size:10.5px;color:var(--ink3);font-weight:600;padding:4px 0;border-radius:6px}
.gh small{display:block;font-size:9px;font-weight:500;margin-top:1px}
.gh.hl{background:#c8f0ff;color:#28738b}
.gh.hl small{color:#4c96aa}
.gh.we{color:#c3c9d3}
.gtime{font-size:9px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1.3;text-align:center}
.gtime b{font-size:10.5px;color:var(--ink2);font-weight:700}
.gcell{background:#f1f5f7;border-radius:7px;min-height:52px}
.gblock{border-radius:8px;padding:5px 4px;color:#fff;overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.gblock .gn{font-weight:700;font-size:10px;letter-spacing:-.2px;line-height:1.25}
.gblock .gr{font-size:8.5px;opacity:.92;line-height:1.25}

/* ---------- tabbar ---------- */
.tabbar{flex:0 0 auto;height:62px;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;color:var(--ink3);font-size:10.5px;font-weight:600;transition:.15s}
.tabbar div.on{color:var(--brand)}
.tabbar div .ti{font-size:19px;line-height:1}

/* ---------- sheet ---------- */
.mask{position:absolute;inset:0;background:rgba(15,20,35,.42);opacity:0;pointer-events:none;
  transition:.24s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:21;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:76%;
  display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sh-handle{width:38px;height:4px;background:#dfe3ea;border-radius:2px;margin:9px auto 4px;flex:0 0 auto}
.sh-title{text-align:center;font-size:15px;font-weight:700;padding:4px 0 10px;flex:0 0 auto}
.sh-body{overflow-y:auto;padding:0 16px 22px}
.sh-body::-webkit-scrollbar{width:0}

.wkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wkitem{background:#f5f7fa;border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;border:2px solid transparent}
.wkitem b{display:block;font-size:13px;font-weight:700}
.wkitem small{display:block;font-size:9.5px;color:var(--ink3);margin-top:2px}
.wkitem.on{border-color:var(--brand);background:#eaf0fe}
.wkitem.on b,.wkitem.on small{color:var(--brand)}
.wkitem.now b:after{content:"·";color:var(--rose)}

.dt-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.dt-h .sq{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:17px;font-weight:700}
.dt-h h3{font-size:18px;font-weight:700;line-height:1.3}
.dt-h p{font-size:12px;color:var(--ink2);margin-top:4px}
.dt-row{display:flex;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.dt-row b{flex:0 0 74px;color:var(--ink3);font-weight:500;font-size:12.5px}
.dt-row span{flex:1;color:var(--ink);line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips i{font-style:normal;font-size:10.5px;background:#f1f3f7;color:var(--ink2);padding:3px 8px;border-radius:14px}

/* ---------- all courses ---------- */
.acard{background:#fff;border:1px solid #e0e9ed;border-radius:16px;padding:13px 14px;margin-bottom:10px;
  box-shadow:0 6px 18px rgba(69,96,107,.08)}
.ac-top{display:flex;gap:10px;align-items:flex-start}
.ac-sq{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:13px;font-weight:700}
.ac-top h5{font-size:14.5px;font-weight:700;line-height:1.35}
.ac-top p{font-size:11.5px;color:var(--ink2);margin-top:4px}
.ac-meta{font-size:11.5px;color:var(--ink2);margin-top:10px;display:flex;flex-direction:column;gap:5px}
.ac-meta div{display:flex;gap:6px}
.ac-meta b{color:var(--ink3);font-weight:500;flex:0 0 auto}
.wkmini{display:flex;gap:2px;margin-top:11px}
.wkmini i{flex:1;height:16px;background:#f0f2f6;border-radius:3px;font-style:normal}
.wkmini i.f{background:var(--brand)}
.wkmini-l{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink3);margin-top:4px}
.sec-t{font-size:12.5px;font-weight:700;color:var(--ink2);margin:16px 2px 9px}

@media(max-width:520px){
  body{padding:0;display:block}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .notch,.sbar{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="sbar">
      <span id="clock">9:41</span>
      <div class="dots"><i></i><i></i><i></i><div class="bat"></div></div>
    </div>

    <header class="appbar">
      <div class="ab-top">
        <div class="ab-title" id="abTitle">我的课表</div>
        <button class="today-btn" id="btnToday">回到本周</button>
      </div>
      <div class="ab-sub" id="abSub"></div>
    </header>

    <div class="weekbar">
      <button class="nav" id="prevWk">‹</button>
      <div class="wk-mid" id="wkMid">
        <h3>第 1 周 <em>当前</em></h3>
        <p><b>9月7日</b> - <b>9月13日</b></p>
      </div>
      <button class="nav" id="nextWk">›</button>
    </div>

    <div class="daystrip" id="daystrip"></div>

    <div class="switch" id="switchBox">
      <div class="seg">
        <button data-v="list" class="on">日程</button>
        <button data-v="grid">周视图</button>
      </div>
    </div>

    <main class="content" id="content"></main>

    <nav class="tabbar" id="tabbar">
      <div data-t="week" class="on"><span class="ti">▦</span>周课表</div>
      <div data-t="all"><span class="ti">☰</span>全部课程</div>
    </nav>

    <!-- sheets -->
    <div class="mask" id="mask"></div>

    <div class="sheet" id="weekSheet">
      <div class="sh-handle"></div>
      <div class="sh-title">选择周次</div>
      <div class="sh-body"><div class="wkgrid" id="wkGrid"></div></div>
    </div>

    <div class="sheet" id="detailSheet">
      <div class="sh-handle"></div>
      <div class="sh-body" id="detailBody"></div>
    </div>
  </div>
</div>

<script>
/* ============ 数据 ============ */
const META = {
  title:'我的课表', subtitle:'2026-2027-1学期'
};
const TERM_START = new Date(2026, 8, 7);   // 2026-09-07 周一 = 第1周
const TOTAL_WEEKS = 20;

const SLOTS = [
  {r:1, label:'1-2节',  st:'08:00', et:'09:35', name:'第一大节', sec:[1,2]},
  {r:2, label:'3-4节',  st:'10:05', et:'11:40', name:'第二大节', sec:[3,4]},
  {r:3, label:'5-6节',  st:'14:00', et:'15:35', name:'第三大节', sec:[5,6]},
  {r:4, label:'7-8节',  st:'15:55', et:'17:30', name:'第四大节', sec:[7,8]},
  {r:5, label:'9-11节', st:'19:00', et:'21:25', name:'第五大节', sec:[9,11]}
];
const SEC_ST = {1:'08:00',3:'10:05',5:'14:00',7:'15:55',9:'19:00'};
const SEC_ET = {2:'09:35',4:'11:40',6:'15:35',8:'17:30',11:'21:25'};

const C = {
  rose:'--rose', blue:'--blue', purple:'--purple', orange:'--orange', teal:'--teal', green:'--green'
};
const COURSES = [
  {id:1, name:'形势与政策(5)', ab:'形势', room:'诚毅3号楼 3-603',
   code:'9354925',
   color:'rose', day:1, sec:[1,2], weeks:[[13,16]]},
  {id:2, name:'数字动画设计', ab:'动画', room:'诚毅13号楼 13-405',
   code:'93R7730',
   color:'blue', day:2, sec:[1,4], weeks:[[1,16]]},
  {id:3, name:'动画运动规律', ab:'规律', room:'诚毅14号楼 14-509',
   code:'93R8710',
   color:'purple', day:3, sec:[1,2], weeks:[[13,16]]},
  {id:4, name:'动画运动规律', ab:'规律', room:'诚毅14号楼 14-507',
   code:'93R8710',
   color:'purple', day:4, sec:[3,4], weeks:[[5,14]]},
  {id:5, name:'动画运动规律', ab:'规律', room:'诚毅3号楼 3-403',
   code:'93R8710',
   color:'purple', day:2, sec:[5,6], weeks:[[4,13]]},
  {id:6, name:'游戏创作', ab:'游戏', room:'诚毅13号楼 13-405',
   code:'93S9900',
   color:'orange', day:4, sec:[5,8], weeks:[[2,13]]},
  {id:7, name:'数字三维制作（2）', ab:'三维', room:'诚毅13号楼 13-405',
   code:'93Q7722',
   color:'teal', day:1, sec:[9,11], weeks:[[1,16]]},
  {id:8, name:'计算机系统与网络技术', ab:'计网', room:'诚毅8号楼 8-201',
   code:'93Q4720',
   color:'green', day:2, sec:[9,11], weeks:[[1,16]]}
];

const WD = ['周一','周二','周三','周四','周五','周六','周日'];

/* ============ 工具 ============ */
function wkStart(n){ const d = new Date(TERM_START); d.setDate(d.getDate() + 7*(n-1)); return d; }
function wkEnd(n){ const d = wkStart(n); d.setDate(d.getDate()+6); return d; }
function fmt(d){ return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
function fmtShort(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function dayDate(n, dayIdx){ const d = wkStart(n); d.setDate(d.getDate() + dayIdx - 1); return d; }
function rowOf(sec){ return sec<=2?1 : sec<=4?2 : sec<=6?3 : sec<=8?4 : 5; }
function inWeeks(c, n){ return c.weeks.some(w => n>=w[0] && n<=w[1]); }
function weeksText(c){ return c.weeks.map(w => w[0]===w[1] ? w[0]+'周' : w[0]+'-'+w[1]+'周').join('、'); }
function timeText(c){
  const s = SEC_ST[c.sec[0]] || '08:00';
  const e = SEC_ET[c.sec[1]] || SEC_ET[c.sec[0]+1] || '09:35';
  return s + '~' + e;
}
function secText(c){ return c.sec[0]===c.sec[1] ? c.sec[0]+'节' : c.sec[0]+'-'+c.sec[1]+'节'; }
function colorOf(key){ return getComputedStyle(document.documentElement).getPropertyValue(C[key]||C.blue).trim() || '#3b7ddd'; }

/* 当前周（按真实日期计算） */
function currentWeek(){
  const now = new Date(); now.setHours(0,0,0,0);
  const s = new Date(TERM_START); s.setHours(0,0,0,0);
  const diff = Math.floor((now - s) / 86400000);
  if (diff < 0) return 1;
  return Math.min(TOTAL_WEEKS, Math.floor(diff/7) + 1);
}
function todayIdx(){
  const d = new Date().getDay(); return d===0 ? 7 : d;
}

/* ============ 状态 ============ */
const st = { week: currentWeek(), day: todayIdx(), view:'list', tab:'week' };

/* ============ 渲染 ============ */
const $ = s => document.querySelector(s);
const content = $('#content');

function renderHeader(){
  $('#abTitle').textContent = META.title;
  $('#abSub').textContent = META.subtitle;
}

function renderWeekBar(){
  const n = st.week, s = wkStart(n), e = wkEnd(n);
  const isNow = n === currentWeek();
  $('#wkMid').innerHTML =
    '<h3>第 ' + n + ' 周' + (isNow ? '<em>本周</em>' : '') + '</h3>' +
    '<p><b>' + fmt(s) + '</b> - <b>' + fmt(e) + '</b> · 共 ' + countWeek(n) + ' 门课</p>';
  $('#prevWk').disabled = n <= 1;
  $('#nextWk').disabled = n >= TOTAL_WEEKS;
}

function countWeek(n){ return COURSES.filter(c => inWeeks(c, n)).length; }

function renderDayStrip(){
  const box = $('#daystrip'); box.innerHTML = '';
  for (let d=1; d<=7; d++){
    const dt = dayDate(st.week, d);
    const has = COURSES.some(c => c.day===d && inWeeks(c, st.week));
    const el = document.createElement('div');
    const isToday = (st.week===currentWeek() && d===todayIdx());
    el.className = 'dchip' + (st.day===d?' on':'') + (isToday?' today':'');
    el.innerHTML = '<div class="dw">' + WD[d-1] + '</div><div class="dd">' + dt.getDate() +
                   '</div><div class="dot' + (has?'':' hide') + '"></div>';
    el.onclick = () => { st.day = d; render(); };
    box.appendChild(el);
  }
}

function cardHTML(c, withDate){
  const col = colorOf(c.color);
  const dt = dayDate(st.week, c.day);
  return '<div class="card" data-id="' + c.id + '">' +
    '<div class="bar" style="background:' + col + '"></div>' +
    '<div class="tcol"><div class="t1">' + timeText(c).split('~')[0] + '</div>' +
      '<div class="t2">' + timeText(c).split('~')[1] + '<br>' + secText(c) + '</div></div>' +
    '<div class="body"><h5>' + c.name + '</h5>' +
      '<div class="meta">' +
        '<div><b>地点</b><span>' + c.room + '</span></div>' +
        '<div><b>时间</b><span>' + timeText(c) + ' · ' + secText(c) + '</span></div>' +
        (withDate ? '<div><b>日期</b><span>' + fmt(dt) + ' ' + WD[c.day-1] + '</span></div>' : '') +
      '</div></div>' +
    '<div class="wk" style="background:' + col + '1a;color:' + col + '">' + weeksText(c) + '</div>' +
  '</div>';
}

function renderList(){
  let h = '';
  if (st.day === 0){
    // 整周
    let total = 0;
    for (let d=1; d<=7; d++){
      const list = COURSES.filter(c => c.day===d && inWeeks(c, st.week))
                          .sort((a,b)=>a.sec[0]-b.sec[0]);
      if (!list.length) continue;
      total += list.length;
      const dt = dayDate(st.week, d);
      const isToday = (st.week===currentWeek() && d===todayIdx());
      h += '<div class="dayhead"><h4>' + WD[d-1] + '</h4><span>' + fmt(dt) + '</span>' +
           (isToday?'<span class="tag">今天</span>':'') + '</div>';
      list.forEach(c => h += cardHTML(c, false));
    }
    if (!total) h = emptyHTML('本周没有排课');
  } else {
    const list = COURSES.filter(c => c.day===st.day && inWeeks(c, st.week))
                        .sort((a,b)=>a.sec[0]-b.sec[0]);
    const dt = dayDate(st.week, st.day);
    const isToday = (st.week===currentWeek() && st.day===todayIdx());
    h += '<div class="dayhead"><h4>' + WD[st.day-1] + '</h4><span>' + fmt(dt) + '</span>' +
         (isToday?'<span class="tag">今天</span>':'') +
         '<span style="margin-left:auto;font-size:11.5px;color:#98a1b0">' + list.length + ' 门课</span></div>';
    if (list.length) list.forEach(c => h += cardHTML(c, false));
    else h = '<div class="dayhead"><h4>' + WD[st.day-1] + '</h4><span>' + fmt(dt) + '</span></div>' + emptyHTML('这一天没有课');
  }
  content.innerHTML = h;
  content.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDetail(+el.dataset.id);
  });
}

function emptyHTML(txt){
  return '<div class="empty"><div class="ic">☕</div><p>' + txt + '</p></div>';
}

function renderGrid(){
  const cur = currentWeek(), ti = todayIdx();
  const occ = {};   // "r,d" -> true
  const H = 58;     // 单行高度
  let h = '<div class="gridwrap"><div class="grow">';

  // 表头（第1行）
  h += '<div></div>';
  for (let d=1; d<=7; d++){
    const dt = dayDate(st.week, d);
    const hl = (st.week===cur && d===ti) ? ' hl' : '';
    const we = (d>=6) ? ' we' : '';
    h += '<div class="gh' + hl + we + '">' + WD[d-1].slice(1) + '<small>' + dt.getDate() + '</small></div>';
  }

  // 时间轴 + 课程块（第2~6行）
  for (let r=1; r<=5; r++){
    const s = SLOTS[r-1];
    h += '<div class="gtime" style="grid-row:' + (r+1) + ';grid-column:1">' +
         '<b>' + s.label.replace('节','') + '</b><span>' + s.st + '</span></div>';
    for (let d=1; d<=7; d++){
      if (occ[r+','+d]) continue;
      const c = COURSES.find(x => x.day===d && inWeeks(x, st.week) && rowOf(x.sec[0])===r);
      if (c){
        const r0 = rowOf(c.sec[0]), r1 = rowOf(c.sec[1]);
        const span = r1 - r0 + 1;
        for (let k=r0; k<=r1; k++) occ[k+','+d] = true;
        h += '<div class="gblock" data-id="' + c.id + '" style="background:' + colorOf(c.color) +
             ';grid-row:' + (r0+1) + ' / span ' + span + ';grid-column:' + (d+1) +
             ';min-height:' + (span*H + (span-1)*3) + 'px">' +
             '<div class="gn">' + c.name + '</div>' +
             '<div class="gr">' + c.room.replace('诚毅','') + '</div></div>';
      } else {
        occ[r+','+d] = true;
        h += '<div class="gcell" style="grid-row:' + (r+1) + ';grid-column:' + (d+1) + '"></div>';
      }
    }
  }
  h += '</div>';
  h += '</div>';
  content.innerHTML = h;
  content.querySelectorAll('.gblock').forEach(el => el.onclick = () => openDetail(+el.dataset.id));
}

function renderAll(){
  let h = '<div class="sec-t">本学期课程（共 ' + COURSES.length + ' 条排课记录）</div>';
  COURSES.forEach(c => {
    const col = colorOf(c.color);
    h += '<div class="acard">' +
      '<div class="ac-top"><div class="ac-sq" style="background:' + col + '">' + c.ab + '</div>' +
      '<div><h5>' + c.name + '</h5><p>' + WD[c.day-1] + ' · ' + timeText(c) + '</p></div></div>' +
      '<div class="ac-meta">' +
        '<div><b>地点</b><span>' + c.room + '</span></div>' +
        '<div><b>周次</b><span>第 ' + weeksText(c) + '</span></div>' +
        '<div><b>课程代码</b><span>' + c.code + '</span></div>' +
      '</div>' +
      '<div class="wkmini">' +
        Array.from({length:TOTAL_WEEKS}, (_,i) => '<i class="' + (inWeeks(c,i+1)?'f':'') + '" style="' +
          (inWeeks(c,i+1) ? 'background:'+col : '') + '" title="第'+(i+1)+'周"></i>').join('') +
      '</div>' +
      '<div class="wkmini-l"><span>第1周</span><span>第' + TOTAL_WEEKS + '周</span></div>' +
    '</div>';
  });
  content.innerHTML = h;
}

function render(){
  const isWeekTab = st.tab === 'week';
  $('#daystrip').style.display = isWeekTab ? 'flex' : 'none';
  $('#switchBox').style.display = isWeekTab ? 'block' : 'none';
  $('.weekbar').style.display = isWeekTab ? 'flex' : 'none';
  $('#abSub').textContent = isWeekTab
    ? META.subtitle
    : '共 ' + COURSES.length + ' 条排课 · ' + new Set(COURSES.map(c=>c.name)).size + ' 门课程';
  if (!isWeekTab){ renderAll(); return; }
  renderWeekBar(); renderDayStrip();
  st.view === 'list' ? renderList() : renderGrid();
  content.scrollTop = 0;
}

/* ============ 弹层 ============ */
function openSheet(id){ $('#mask').classList.add('on'); $(id).classList.add('on'); }
function closeSheets(){ $('#mask').classList.remove('on');
  $('#weekSheet').classList.remove('on'); $('#detailSheet').classList.remove('on'); }
$('#mask').onclick = closeSheets;

$('#wkMid').onclick = () => {
  const g = $('#wkGrid'); g.innerHTML = '';
  const cur = currentWeek();
  for (let i=1; i<=TOTAL_WEEKS; i++){
    const el = document.createElement('div');
    el.className = 'wkitem' + (i===st.week?' on':'') + (i===cur?' now':'');
    el.innerHTML = '<b>第' + i + '周</b><small>' + fmtShort(wkStart(i)) + '-' + fmtShort(wkEnd(i)) + '</small>';
    el.onclick = () => { st.week = i; closeSheets(); render(); };
    g.appendChild(el);
  }
  openSheet('#weekSheet');
};

function openDetail(id){
  const c = COURSES.find(x => x.id === id);
  if (!c) return;
  const col = colorOf(c.color);
  const dt = dayDate(st.week, c.day);
  const dates = [];
  c.weeks.forEach(w => { for (let n=w[0]; n<=w[1]; n++) dates.push(fmt(dayDate(n, c.day))); });
  $('#detailBody').innerHTML =
    '<div class="dt-h"><div class="sq" style="background:' + col + '">' + c.ab + '</div>' +
      '<div><h3>' + c.name + '</h3><p>' + timeText(c) + ' · ' + secText(c) + '</p></div></div>' +
    '<div class="dt-row"><b>本周日期</b><span>' + fmt(dt) + ' ' + WD[c.day-1] +
      (inWeeks(c, st.week) ? '（本周有课）' : '（本周无课）') + '</span></div>' +
    '<div class="dt-row"><b>上课地点</b><span>' + c.room + '</span></div>' +
    '<div class="dt-row"><b>上课周次</b><span>第 ' + weeksText(c) + '</span></div>' +
    '<div class="dt-row"><b>课程代码</b><span>' + c.code + '</span></div>' +
    '<div class="dt-row"><b>全部日期</b><span><div class="chips">' +
      dates.map(d => '<i>' + d + '</i>').join('') + '</div></span></div>';
  openSheet('#detailSheet');
}

/* ============ 事件 ============ */
$('#prevWk').onclick = () => { if (st.week > 1){ st.week--; render(); } };
$('#nextWk').onclick = () => { if (st.week < TOTAL_WEEKS){ st.week++; render(); } };
$('#btnToday').onclick = () => { st.week = currentWeek(); st.day = todayIdx(); render(); };
document.querySelectorAll('.seg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); st.view = b.dataset.v; render();
  };
});
document.querySelectorAll('#tabbar div').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('#tabbar div').forEach(x => x.classList.remove('on'));
    t.classList.add('on'); st.tab = t.dataset.t; render();
  };
});

/* 时钟 */
(function clock(){
  const d = new Date();
  $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock, 20000);
})();

renderHeader();
render();
</script>
</body>
</html>
